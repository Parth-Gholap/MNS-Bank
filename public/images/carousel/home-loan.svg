<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#grad1)"/>
  <rect width="1200" height="600" fill="url(#grad2)"/>
  
  <!-- House -->
  <g transform="translate(700, 200)">
    <!-- House Base -->
    <rect x="0" y="50" width="200" height="150" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
    
    <!-- Roof -->
    <polygon points="-20,50 100,-20 220,50" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="75" y="120" width="50" height="80" fill="#92400e" stroke="#78350f" stroke-width="2"/>
    <circle cx="110" cy="160" r="3" fill="#fbbf24"/>
    
    <!-- Windows -->
    <rect x="20" y="80" width="40" height="40" fill="#60a5fa" stroke="#3b82f6" stroke-width="2"/>
    <rect x="140" y="80" width="40" height="40" fill="#60a5fa" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Chimney -->
    <rect x="150" y="10" width="30" height="60" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
    
    <!-- Garden -->
    <ellipse cx="100" cy="210" rx="120" ry="20" fill="#22c55e" opacity="0.3"/>
    
    <!-- Trees -->
    <circle cx="-30" cy="180" r="25" fill="#16a34a"/>
    <rect x="-35" y="180" width="10" height="30" fill="#92400e"/>
    
    <circle cx="230" cy="170" r="20" fill="#16a34a"/>
    <rect x="226" y="170" width="8" height="25" fill="#92400e"/>
  </g>
  
  <!-- Keys -->
  <g transform="translate(200, 250)">
    <!-- Key Ring -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#fbbf24" stroke-width="3"/>
    
    <!-- Key 1 -->
    <rect x="15" y="-3" width="60" height="6" fill="#fbbf24"/>
    <rect x="65" y="-3" width="8" height="6" fill="#fbbf24"/>
    <rect x="73" y="-3" width="5" height="6" fill="#fbbf24"/>
    <circle cx="20" cy="0" r="8" fill="#fbbf24"/>
    <circle cx="20" cy="0" r="4" fill="#16a34a"/>
    
    <!-- Key 2 -->
    <rect x="15" y="10" width="50" height="6" fill="#fbbf24"/>
    <rect x="60" y="10" width="8" height="6" fill="#fbbf24"/>
    <rect x="68" y="10" width="5" height="6" fill="#fbbf24"/>
    <circle cx="20" cy="13" r="8" fill="#fbbf24"/>
    <circle cx="20" cy="13" r="4" fill="#16a34a"/>
  </g>
  
  <!-- Document/Paper -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="80" height="100" fill="white" stroke="#d1d5db" stroke-width="2" rx="2"/>
    <rect x="10" y="10" width="60" height="3" fill="#d1d5db"/>
    <rect x="10" y="20" width="50" height="3" fill="#d1d5db"/>
    <rect x="10" y="30" width="55" height="3" fill="#d1d5db"/>
    <rect x="10" y="40" width="45" height="3" fill="#d1d5db"/>
    
    <!-- Signature Line -->
    <rect x="10" y="70" width="40" height="2" fill="#16a34a"/>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Approved</text>
  </g>
  
  <!-- Percentage Badge -->
  <g transform="translate(400, 150)">
    <circle cx="0" cy="0" r="40" fill="#dc2626"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">6.5%</text>
    <text x="0" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Interest</text>
  </g>
  
  <!-- Text Overlay -->
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" opacity="0.9">Home Loans</text>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.7">Your Dream Home Awaits</text>
  
  <!-- Floating Elements -->
  <g opacity="0.3">
    <circle cx="300" cy="80" r="2" fill="#22c55e"/>
    <circle cx="500" cy="120" r="3" fill="#22c55e"/>
    <circle cx="600" cy="90" r="2" fill="#22c55e"/>
    <circle cx="150" cy="400" r="3" fill="#22c55e"/>
    <circle cx="350" cy="450" r="2" fill="#22c55e"/>
  </g>
</svg>
