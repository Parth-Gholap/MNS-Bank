<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#grad1)"/>
  <rect width="1200" height="600" fill="url(#grad2)"/>
  
  <!-- Piggy Bank -->
  <g transform="translate(750, 250)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="80" ry="60" fill="#f87171" stroke="#dc2626" stroke-width="3"/>
    
    <!-- Head -->
    <circle cx="-50" cy="-20" r="35" fill="#f87171" stroke="#dc2626" stroke-width="3"/>
    
    <!-- Snout -->
    <ellipse cx="-80" cy="-20" rx="20" ry="15" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
    <circle cx="-85" cy="-20" r="3" fill="#991b1b"/>
    <circle cx="-75" cy="-20" r="3" fill="#991b1b"/>
    
    <!-- Eye -->
    <circle cx="-55" cy="-25" r="5" fill="#1f2937"/>
    <circle cx="-54" cy="-26" r="2" fill="white"/>
    
    <!-- Ears -->
    <path d="M -70,-45 Q -65,-55 -60,-45" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <path d="M -40,-45 Q -35,-55 -30,-45" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Legs -->
    <rect x="-60" y="40" width="15" height="30" rx="7" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <rect x="-40" y="40" width="15" height="30" rx="7" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <rect x="25" y="40" width="15" height="30" rx="7" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <rect x="45" y="40" width="15" height="30" rx="7" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Tail -->
    <path d="M 70,0 Q 90,-10 85,10 Q 80,20 75,10" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Coin Slot -->
    <rect x="-5" y="-40" width="10" height="3" fill="#991b1b"/>
  </g>
  
  <!-- Coins -->
  <g transform="translate(200, 200)">
    <!-- Coin 1 -->
    <ellipse cx="0" cy="0" rx="25" ry="20" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">₹</text>
    
    <!-- Coin 2 -->
    <ellipse cx="60" cy="20" rx="25" ry="20" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">₹</text>
    
    <!-- Coin 3 -->
    <ellipse cx="30" cy="60" rx="25" ry="20" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <text x="30" y="65" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">₹</text>
  </g>
  
  <!-- Bank Card -->
  <g transform="translate(150, 350)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="10" y="8" width="80" height="6" rx="2" fill="#dc2626"/>
    <rect x="10" y="20" width="50" height="4" rx="2" fill="#f87171"/>
    <rect x="10" y="28" width="60" height="4" rx="2" fill="#f87171"/>
    <circle cx="75" cy="45" r="12" fill="#dc2626"/>
    <text x="75" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">VISA</text>
  </g>
  
  <!-- Zero Balance Badge -->
  <g transform="translate(400, 150)">
    <circle cx="0" cy="0" r="45" fill="#dc2626"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">ZERO</text>
    <text x="0" y="15" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">BALANCE</text>
  </g>
  
  <!-- Calculator -->
  <g transform="translate(550, 350)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
    <rect x="5" y="5" width="70" height="20" fill="#1f2937"/>
    <text x="40" y="18" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12">50,000</text>
    
    <!-- Buttons -->
    <g>
      <rect x="10" y="30" width="15" height="12" rx="2" fill="#e5e7eb"/>
      <rect x="30" y="30" width="15" height="12" rx="2" fill="#e5e7eb"/>
      <rect x="50" y="30" width="15" height="12" rx="2" fill="#e5e7eb"/>
      
      <rect x="10" y="45" width="15" height="12" rx="2" fill="#e5e7eb"/>
      <rect x="30" y="45" width="15" height="12" rx="2" fill="#e5e7eb"/>
      <rect x="50" y="45" width="15" height="12" rx="2" fill="#e5e7eb"/>
      
      <rect x="10" y="60" width="15" height="12" rx="2" fill="#e5e7eb"/>
      <rect x="30" y="60" width="15" height="12" rx="2" fill="#e5e7eb"/>
      <rect x="50" y="60" width="15" height="12" rx="2" fill="#dc2626"/>
      
      <rect x="10" y="75" width="35" height="12" rx="2" fill="#dc2626"/>
      <rect x="50" y="75" width="15" height="12" rx="2" fill="#dc2626"/>
    </g>
  </g>
  
  <!-- Text Overlay -->
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" opacity="0.9">Zero Balance</text>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.7">Banking Without Boundaries</text>
  
  <!-- Floating Elements -->
  <g opacity="0.3">
    <circle cx="300" cy="80" r="2" fill="#ef4444"/>
    <circle cx="500" cy="120" r="3" fill="#ef4444"/>
    <circle cx="600" cy="90" r="2" fill="#ef4444"/>
    <circle cx="150" cy="480" r="3" fill="#ef4444"/>
    <circle cx="350" cy="520" r="2" fill="#ef4444"/>
  </g>
</svg>
