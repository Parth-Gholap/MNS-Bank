<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#grad1)"/>
  <rect width="1200" height="600" fill="url(#grad2)"/>
  
  <!-- Smartphone -->
  <g transform="translate(800, 150)">
    <!-- Phone Frame -->
    <rect x="-60" y="-120" width="120" height="240" rx="20" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="-55" y="-115" width="110" height="230" rx="15" fill="#111827"/>
    
    <!-- Screen -->
    <rect x="-50" y="-110" width="100" height="180" rx="10" fill="#1e40af"/>
    
    <!-- App Interface -->
    <rect x="-45" y="-105" width="90" height="30" rx="5" fill="#3b82f6"/>
    <text x="0" y="-85" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">MNS Bank</text>
    
    <!-- Balance Display -->
    <rect x="-40" y="-65" width="80" height="40" rx="5" fill="#1f2937"/>
    <text x="0" y="-50" text-anchor="middle" fill="#60a5fa" font-family="Arial, sans-serif" font-size="10">Balance</text>
    <text x="0" y="-35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">₹50,000</text>
    
    <!-- Menu Items -->
    <rect x="-40" y="-15" width="35" height="25" rx="5" fill="#374151"/>
    <rect x="-5" y="-15" width="35" height="25" rx="5" fill="#374151"/>
    <rect x="-40" y="15" width="35" height="25" rx="5" fill="#374151"/>
    <rect x="-5" y="15" width="35" height="25" rx="5" fill="#374151"/>
    
    <!-- Icons -->
    <circle cx="-22" cy="-2" r="8" fill="#60a5fa"/>
    <circle cx="12" cy="-2" r="8" fill="#60a5fa"/>
    <circle cx="-22" cy="27" r="8" fill="#60a5fa"/>
    <circle cx="12" cy="27" r="8" fill="#60a5fa"/>
    
    <!-- Home Button -->
    <circle cx="0" cy="75" r="8" fill="#374151" stroke="#60a5fa" stroke-width="1"/>
  </g>
  
  <!-- Banking Elements -->
  <g transform="translate(200, 200)">
    <!-- Credit Card -->
    <rect x="0" y="0" width="120" height="75" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="8" rx="2" fill="#3b82f6"/>
    <rect x="10" y="25" width="60" height="5" rx="2" fill="#60a5fa"/>
    <circle cx="95" cy="55" r="15" fill="#60a5fa"/>
    <text x="95" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">VISA</text>
  </g>
  
  <g transform="translate(150, 350)">
    <!-- Bank Building -->
    <rect x="0" y="0" width="100" height="80" fill="#1f2937"/>
    <polygon points="0,0 50,-30 100,0" fill="#374151"/>
    <!-- Columns -->
    <rect x="10" y="20" width="8" height="60" fill="#60a5fa"/>
    <rect x="30" y="20" width="8" height="60" fill="#60a5fa"/>
    <rect x="50" y="20" width="8" height="60" fill="#60a5fa"/>
    <rect x="70" y="20" width="8" height="60" fill="#60a5fa"/>
    <!-- Door -->
    <rect x="42" y="50" width="16" height="30" fill="#1e40af"/>
  </g>
  
  <!-- Floating Elements -->
  <g opacity="0.3">
    <circle cx="150" cy="100" r="3" fill="#60a5fa"/>
    <circle cx="250" cy="150" r="2" fill="#60a5fa"/>
    <circle cx="350" cy="120" r="4" fill="#60a5fa"/>
    <circle cx="450" cy="180" r="2" fill="#60a5fa"/>
    <circle cx="550" cy="140" r="3" fill="#60a5fa"/>
  </g>
  
  <!-- Text Overlay -->
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" opacity="0.9">Digital Banking</text>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.7">Bank Anytime, Anywhere</text>
</svg>
